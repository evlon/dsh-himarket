# dsh-himarket bundle layer: inserts the HiMarket bridge row into the composition.
# The bridge publishes no service; it only consumes webServer/tools/settings, so it
# sits loose in the host plane (same shape as dsh-matrix).
- insert:
    - id: himarket
      name: dsh-himarket
      config:
        # 桥接包在运行时经 createRequire(ctx.baseUrl) 解析官方 @deepseek-ai/* 包，
        # 无需在此声明它们；这里只放桥接自身可调的默认值。
        skillInstallDir: ''
        # 内网域名可切换：默认指向新 K8S 环境（*.ai.ict.cmcc），旧环境并存时可覆盖。
        #   新环境（默认，无需写）：baseUrl: http://market.ai.ict.cmcc
        #                            gatewayUrl: http://job.ai.ict.cmcc
        #   旧环境：baseUrl: http://ai-market.ict.cmcc
        #           gatewayUrl: http://ai-job.ict.cmcc
        # ⚠️ gatewayUrl 指的是「岗位发布台」（dsh-himarket-gateway:3091），
        #    新环境域名是 job.ai.ict.cmcc；而 gateway.ai.ict.cmcc 是 Higress 控制台，不是它。
        # 也可整体切档：环境变量 DSH_DEPLOY_ENV=legacy（旧）/ 默认 new（新）。
        # baseUrl: ''
        # gatewayUrl: ''
